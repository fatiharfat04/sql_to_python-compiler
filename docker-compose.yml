services:
  mysql:
    image: mysql:8.4
    container_name: sqlc-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sqlc_test
    ports:
      - "3307:3306"
    volumes:
      - ./examples/mysql_init.sql:/docker-entrypoint-initdb.d/10_mysql_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 25s

  adminer:
    image: adminer:latest
    container_name: sqlc-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
